[workspace]
resolver = "3"
members = ["crates/core", "crates/winsys", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
wincare-core = { path = "crates/core" }
wincare-winsys = { path = "crates/winsys" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
