name: Bug report
description: Something did not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! **If win-care deleted something you did not choose, or a protected
        folder was touched, please report it privately instead:** see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Smart Scan
        2. Click Clean
        3. ...
  - type: input
    id: version
    attributes:
      label: win-care version
      description: Shown in About.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Press Win+R, type `winver`.
      placeholder: Windows 11 24H2 (26100)
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Please blur personal file names and paths.
