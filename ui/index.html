<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>win-care</title>
    <!--
      Start-up splash: plain HTML + CSS so it paints before any JavaScript loads.
      It adds no delay: main.ts removes it as soon as the app has mounted.
      Animations use transform/opacity only, which the GPU handles.
    -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 50% 40%, #12306b 0%, #0a1430 55%, #060b1a 100%);
        color: #e5e9f0;
        font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, sans-serif;
        transition: opacity 0.25s ease;
      }
      #splash.done {
        opacity: 0;
      }
      #splash .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
      }
      #splash .orb {
        position: relative;
        width: 132px;
        height: 132px;
        display: grid;
        place-items: center;
      }
      /* Two counter-rotating rings, like a scanner sweeping the system. */
      #splash .ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: conic-gradient(from 0deg, transparent 0 55%, #06b6d4 80%, #2563eb 100%);
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 2px));
        animation: spin 1.4s linear infinite;
      }
      #splash .ring.inner {
        inset: 14px;
        background: conic-gradient(from 180deg, transparent 0 60%, #16a34a 85%, #06b6d4 100%);
        animation-duration: 2.1s;
        animation-direction: reverse;
        opacity: 0.8;
      }
      #splash .glow {
        position: absolute;
        inset: 30px;
        border-radius: 50%;
        background: radial-gradient(circle, rgb(37 99 235 / 0.55), transparent 70%);
        animation: pulse 1.6s ease-in-out infinite;
      }
      #splash svg {
        position: relative;
        width: 56px;
        height: 56px;
      }
      #splash .name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }
      #splash .line {
        font-size: 13px;
        color: #9aa5b8;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      #splash .bar {
        width: 180px;
        height: 3px;
        border-radius: 3px;
        background: rgb(255 255 255 / 0.08);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #06b6d4, transparent);
        animation: sweep 1.1s ease-in-out infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes pulse {
        50% {
          transform: scale(1.15);
          opacity: 0.6;
        }
      }
      @keyframes sweep {
        from {
          transform: translateX(-100%);
        }
        to {
          transform: translateX(250%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-label="Loading win-care">
      <div class="stack">
        <div class="orb" aria-hidden="true">
          <div class="glow"></div>
          <div class="ring"></div>
          <div class="ring inner"></div>
          <svg viewBox="0 0 512 512">
            <path
              d="M256 96l136 48v104c0 92-58 160-136 192-78-32-136-100-136-192V144z"
              fill="#fff"
            />
            <path
              d="M196 262l44 44 84-92"
              fill="none"
              stroke="#16A34A"
              stroke-width="36"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </div>
        <div class="name">win-care</div>
        <div class="line">Getting your PC ready</div>
        <div class="bar" aria-hidden="true"></div>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
